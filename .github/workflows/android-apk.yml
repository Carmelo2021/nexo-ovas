name: Build Android APK (NexoOVA SENA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload NexoOVA-SENA.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoOVA-SENA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
